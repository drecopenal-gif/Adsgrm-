    .toast {

<body>

      <button class="btn btn-green" id="btn-make-link">Generate Short Link</button>

        <button class="btn btn-cyan" id="btn-copy-link" style="margin-top: 10px;">📋 Copy Link</button>

    <!-- 2. UNLOCK GATE (Opens when someone clicks a short link) -->
    <div id="screen-unlock" class="hidden">

  <div id="toast" class="toast"></div>
    <script>
    // Configuration[span_1](start_span)[span_1](end_span)
    const BOT_TOKEN = "8861476101:AAHBeX5H5UchF_9-exmWWm6xPA3wstrZ_Ec";[span_2](start_span)[span_2](end_span)
    const ADMIN_CHAT_ID = "5714243957";[span_3](start_span)[span_3](end_span)
    const ADSGRAM_BLOCK_ID = "38848";

    // Safe Init for Adsgram
    let AdController = null;
    try {
      if (window.Adsgram) {
        AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });
      }
    } catch(e) {
      console.warn("Adsgram Error", e);
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      setTimeout(() => { el.style.display = "none"; }, 2500);
    }

    function showTab(type) {
      document.getElementById("screen-shorten").classList.toggle("hidden", type !== "shorten");
      document.getElementById("screen-earn").classList.toggle("hidden", type !== "earn");
      document.getElementById("btn-tab-shorten").classList.toggle("active", type === "shorten");
      document.getElementById("btn-tab-earn").classList.toggle("active", type === "earn");
      if (type === "earn") loadEarnData();
    }

    // Auto-Fallback Ads Trigger (Never Freezes)
    async function playAds(onComplete) {
      toast("Loading ad stream...");

      // 1. Adsgram with 3.5s timeout
      try {
        if (AdController) {
          await Promise.race([
            AdController.show(),
            new Promise(resolve => setTimeout(resolve, 3500))
          ]);
        }
      } catch(e) {}

      // 2. Monetag with 3s timeout
      try {
        if (typeof show_8980838 === "function") {
          await Promise.race([
            show_8980838(),
            new Promise(resolve => setTimeout(resolve, 3000))
          ]);
        }
      } catch(e) {}

      onComplete();
    }

    // --- 1. SHORTENER SYSTEM ---
    document.getElementById("btn-make-link").addEventListener("click", () => {
      const url = document.getElementById("input-target-link").value.trim();
      if (!url.startsWith("http://") && !url.startsWith("https://")) {
        toast("Please enter a valid link starting with https://");
        return;
      }
      const token = btoa(encodeURIComponent(url));
      const shortUrl = window.location.origin + window.location.pathname + "?link=" + token;

      document.getElementById("text-generated-url").textContent = shortUrl;
      document.getElementById("box-short-result").classList.remove("hidden");
    });

    document.getElementById("btn-copy-link").addEventListener("click", () => {
      const val = document.getElementById("text-generated-url").textContent;
      navigator.clipboard.writeText(val).then(() => toast("Copied to clipboard!"));
    });

    // --- 2. DETECT SHORT LINK & SHOW UNLOCK SCREEN ---
    const params = new URLSearchParams(window.location.search);
    const linkParam = params.get("link");

    if (linkParam) {
      document.getElementById("screen-shorten").classList.add("hidden");
      document.getElementById("screen-earn").classList.add("hidden");
      document.getElementById("tab-nav").classList.add("hidden");
      document.getElementById("screen-unlock").classList.remove("hidden");

      let originalDest = "https://google.com";
      try {
        originalDest = decodeURIComponent(atob(linkParam));
      } catch(e) {}

      document.getElementById("btn-start-unlock").addEventListener("click", () => {
        const btn = document.getElementById("btn-start-unlock");
        btn.disabled = true;
        btn.textContent = "Verifying Ads...";

        playAds(() => {
          btn.classList.add("hidden");
          const doneBox = document.getElementById("box-unlocked-done");
          const openBtn = document.getElementById("btn-go-destination");
          openBtn.href = originalDest;
          doneBox.classList.remove("hidden");
          toast("Unlocked successfully!");
        });
      });
    }

    // --- 3. EARN MONEY & UPI DISPATCH ---
    const TODAY = "tasks_" + new Date().toISOString().slice(0, 10);

    function loadEarnData() {
      const coins = parseInt(localStorage.getItem("coins") || "0");
      const done = parseInt(localStorage.getItem(TODAY) || "0");
      const left = Math.max(0, 25 - done);

      document.getElementById("val-coins").textContent = coins;
      document.getElementById("val-daily").textContent = `${left}/25`;

      const btn = document.getElementById("btn-earn-watch");
      if (left <= 0) {
        btn.disabled = true;
        btn.textContent = "Daily Limit Reached (25/25)";
      }
    }

    document.getElementById("btn-earn-watch").addEventListener("click", () => {
      const done = parseInt(localStorage.getItem(TODAY) || "0");
      if (done >= 25) {
        toast("Daily 25 ad limit reached!");
        return;
      }

      const btn = document.getElementById("btn-earn-watch");
      btn.disabled = true;

      playAds(() => {
        let current = parseInt(localStorage.getItem("coins") || "0") + 10;
        localStorage.setItem("coins", current);
        localStorage.setItem(TODAY, done + 1);
        loadEarnData();
        toast("🎉 +10 Coins Added!");

        // 5 to 8 random cooldown seconds
        const randomSeconds = Math.floor(Math.random() * (8 - 5 + 1)) + 5;
        const timerBox = document.getElementById("earn-timer");
        timerBox.classList.remove("hidden");

        let sec = randomSeconds;
        const interval = setInterval(() => {
          timerBox.textContent = `⏳ Ad Loading... Please wait (${sec}s)`;
          sec--;
          if (sec < 0) {
            clearInterval(interval);
            timerBox.classList.add("hidden");
            const checkDone = parseInt(localStorage.getItem(TODAY) || "0");
            if (checkDone < 25) {
              btn.disabled = false;
              btn.textContent = "🔥 Watch Ads & Earn 10 Coins";
            }
          }
        }, 1000);
      });
    });

    document.getElementById("btn-payout").addEventListener("click", () => {
      const coins = parseInt(localStorage.getItem("coins") || "0");
      const upi = document.getElementById("input-upi").value.trim();

      if (coins < 500) {
        toast(`Need 500 coins to withdraw (You have: ${coins})!`);
        return;
      }
      if (!upi || !upi.includes("@")) {
        toast("Enter a valid UPI address!");
        return;
      }

      const btn = document.getElementById("btn-payout");
      btn.disabled = true;
      btn.textContent = "Sending...";

      const text =
        "<b>💸 New Withdrawal Request!</b>\n" +
        "━━━━━━━━━━━━━━━━━━━━\n" +
        "<b>Coins:</b> 500 (₹5.00 INR)\n" +
        `<b>UPI ID:</b> <code>${upi}</code>\n` +
        `<b>Date:</b> ${new Date().toLocaleString('en-IN')}`;

      const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${encodeURIComponent(ADMIN_CHAT_ID)}&text=${encodeURIComponent(text)}&parse_mode=HTML`;[span_4](start_span)[span_4](end_span)

      fetch(url, { method: "GET", mode: "no-cors" })
        .then(() => {
          localStorage.setItem("coins", coins - 500);
          loadEarnData();
          document.getElementById("input-upi").value = "";
          toast("✅ Request sent! Payout processed in 24 hours.");
          btn.disabled = false;
          btn.textContent = "💸 Withdraw ₹5.00";
        })
        .catch(() => {
          toast("Connection error. Try again.");
          btn.disabled = false;
          btn.textContent = "💸 Withdraw ₹5.00";
        });
    });

    loadEarnData();
  </script>
