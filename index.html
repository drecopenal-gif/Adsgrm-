<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>17F Shorter | Multi-Ad Unlocker</title>
    
    <!-- Telegram & Ad Networks SDKs -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src="//libtl.com/sdk.js" data-zone="11733593" data-sdk="show_11733593"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background: #090d16;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
        }
        .card {
            background: rgba(17, 24, 39, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 34px 24px;
            border-radius: 28px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
        .brand-title {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            user-select: none;
            display: inline-block;
            margin-bottom: 22px;
        }
        .brand-title:active { transform: scale(0.96); }

        .field { text-align: left; margin-bottom: 14px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
        .input-box {
            width: 100%;
            padding: 13px 15px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #38bdf8;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }
        .input-box:focus {
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn-reward {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            border: none;
            border-radius: 15px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
            margin-top: 4px;
            transition: transform 0.1s ease;
        }
        .btn-reward:active { transform: scale(0.98); }
        .btn-reward:disabled { background: #334155; box-shadow: none; cursor: not-allowed; color: #64748b; }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0 16px 0;
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .divider span { padding: 0 10px; }

        .btn-bonus {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            border: none;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 18px -4px rgba(99, 102, 241, 0.4);
            transition: transform 0.1s ease;
        }
        .btn-bonus:active { transform: scale(0.98); }

        .status-badge {
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }
        .status-err { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
        .status-ok { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 15, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }
        .modal-box {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 24px;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #94a3b8;
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }
        .btn-modal {
            width: 100%;
            padding: 13px;
            background: #10b981;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }
        .copy-group { display: flex; gap: 8px; margin-top: 10px; }
        .copy-group input {
            width: 100%;
            padding: 11px 14px;
            background: #090d16;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            color: #34d399;
            font-size: 13px;
            outline: none;
        }
        .copy-group button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 0 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="brand-title" id="secretTitle" onclick="handleSecretTitleClick()">17F Shorter</h1>

        <div class="field">
            <label>Send / Paste Your Link</label>
            <!-- યુઝરને અહીં માત્ર Bot વાળી Shorter Link જ દેખાશે, અસલ Target Link નહિ -->
            <input type="text" id="userLinkInput" class="input-box" placeholder="https://t.me/Filesizes_bot/unlock?startapp=...">
        </div>

        <button id="getRewardBtn" class="btn-reward" onclick="handleDualAdFlow()">
            <span>🎁</span> Get Reward (Unlock Link)
        </button>

        <div class="divider"><span>OR BONUS EARNING</span></div>

        <button id="bonusWatchBtn" class="btn-bonus" onclick="handleBonusAd()">
            <span>🎬</span> Watch Video to Unlock
        </button>

        <div id="statusBadge" class="status-badge"></div>
    </div>

    <!-- Hidden Admin Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-box">
            <button class="close-btn" onclick="toggleModal('loginModal', false)">✕</button>
            <h3 style="margin-bottom: 18px; text-align: left; font-size: 18px;">🔐 Secret Admin Login</h3>
            <div class="field">
                <label>Username</label>
                <input type="text" id="adminUser" class="input-box" placeholder="Enter username" autocomplete="off">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="adminPass" class="input-box" placeholder="Enter password">
            </div>
            <button class="btn-modal" onclick="verifyAdminLogin()">Sign In</button>
        </div>
    </div>

    <!-- Admin Link Creator Panel -->
    <div id="adminPanel" class="modal">
        <div class="modal-box">
            <button class="close-btn" onclick="toggleModal('adminPanel', false)">✕</button>
            <h3 style="margin-bottom: 18px; text-align: left; font-size: 18px;">⚡ Direct Bot Link Generator</h3>
            <div class="field">
                <label>Main Target URL (અસલ લિંક)</label>
                <input type="url" id="mainTargetUrl" class="input-box" placeholder="https://youtu.be/... or file URL">
            </div>
            <button class="btn-modal" onclick="generateShortLink()">Generate Bot Link</button>

            <div id="resultBox" style="display: none; margin-top: 18px;">
                <label style="font-size: 12px; color: #94a3b8; display: block; text-align: left; margin-bottom: 6px;">Direct Bot Link (Auto-Copied)</label>
                <div class="copy-group">
                    <input type="text" id="shortOut" readonly>
                    <button onclick="copyGeneratedLink()">Copy</button>
                </div>
                <p id="copyMsg" style="color: #34d399; font-size: 12px; margin-top: 8px; text-align: left; display: none;">✓ Copied to clipboard!</p>
            </div>
        </div>
    </div>

    <script>
        const ADSGRAM_BLOCK_ID = "46253";
        const BOT_USERNAME = "Filesizes_bot";
        const BOT_APP_NAME = "unlock";

        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // URL / StartParam Extract કરવું
        const params = new URLSearchParams(window.location.search);
        let secretMainUrl = "";

        // Telegram WebApp start_param અથવા browser query
        const tgStartParam = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.start_param) 
                             || params.get("tgWebAppStartParam") 
                             || params.get("startapp") 
                             || params.get("url");

        if (tgStartParam) {
            try {
                // ૧. અસલ લિંકને માત્ર મેમરીમાં ગુપ્ત રાખવી
                secretMainUrl = atob(decodeURIComponent(tgStartParam));
                
                // ૨. ઇનપુટ બોક્સમાં ફક્ત તમે બનાવેલી શોર્ટ BOT LINK જ બતાવવી!
                document.getElementById("userLinkInput").value = `https://t.me/${BOT_USERNAME}/${BOT_APP_NAME}?startapp=${encodeURIComponent(tgStartParam)}`;
            } catch(e) {
                secretMainUrl = "";
            }
        }

        // Adsgram Init
        let AdController = null;
        if (window.Adsgram) {
            AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });
        }

        function playAdsgram() {
            return new Promise((resolve, reject) => {
                if (!AdController) return resolve();
                AdController.show().then(resolve).catch(reject);
            });
        }

        function playMonetag() {
            return new Promise((resolve, reject) => {
                if (typeof show_11733593 === 'function') {
                    show_11733593().then(resolve).catch(reject);
                } else {
                    resolve();
                }
            });
        }

        // DUAL ADS FLOW
        async function handleDualAdFlow() {
            let finalTarget = secretMainUrl;
            const inputVal = document.getElementById("userLinkInput").value.trim();

            // જો યુઝરે જાતે બોટ લિંક પેસ્ટ કરી હોય
            if (!finalTarget && inputVal) {
                try {
                    const parsed = new URL(inputVal);
                    const qParam = parsed.searchParams.get("startapp") || parsed.searchParams.get("tgWebAppStartParam") || parsed.searchParams.get("url");
                    if (qParam) {
                        finalTarget = atob(decodeURIComponent(qParam));
                    } else {
                        finalTarget = inputVal;
                    }
                } catch(e) {
                    finalTarget = inputVal;
                }
            }

            if (!finalTarget) {
                notify("Please enter or paste valid 17F link!", true);
                return;
            }

            const btn = document.getElementById("getRewardBtn");
            btn.disabled = true;

            // 50% રેન્ડમ ઓર્ડર: Adsgram -> Monetag અથવા Monetag -> Adsgram
            const isAdsgramFirst = Math.random() < 0.5;

            try {
                if (isAdsgramFirst) {
                    btn.innerHTML = `<span>⏳</span> Playing Sponsor Ad 1/2...`;
                    await playAdsgram();
                    btn.innerHTML = `<span>⏳</span> Playing Sponsor Ad 2/2...`;
                    await playMonetag();
                } else {
                    btn.innerHTML = `<span>⏳</span> Playing Sponsor Ad 1/2...`;
                    await playMonetag();
                    btn.innerHTML = `<span>⏳</span> Playing Sponsor Ad 2/2...`;
                    await playAdsgram();
                }

                notify("✅ Verification Complete! Opening Link...", false);

                // બંને એડ પત્યા પછી સીધું ઓટોમેટિક ઓપન
                setTimeout(() => {
                    autoOpenInExternalBrowser(finalTarget);
                }, 500);

            } catch (err) {
                notify("⚠️ Please watch both ads completely to unlock link.", true);
                btn.disabled = false;
                btn.innerHTML = `<span>🎁</span> Get Reward (Unlock Link)`;
            }
        }

        function autoOpenInExternalBrowser(url) {
            let cleanUrl = url.trim();
            if (!cleanUrl.startsWith("http://") && !cleanUrl.startsWith("https://")) {
                cleanUrl = "https://" + cleanUrl;
            }

            // Force Open in Phone Browser (Chrome)
            if (window.Telegram && window.Telegram.WebApp && typeof window.Telegram.WebApp.openLink === "function") {
                try {
                    window.Telegram.WebApp.openLink(cleanUrl, { try_browser: 'chrome' });
                    return;
                } catch(e) {}
            }

            window.location.assign(cleanUrl);
        }

        // Bonus Video Button
        function handleBonusAd() {
            const btn = document.getElementById("bonusWatchBtn");
            btn.disabled = true;
            btn.innerHTML = `<span>⏳</span> Loading Video...`;

            playAdsgram().then(() => {
                notify("🎉 Bonus verified! Thank you for supporting.", false);
            }).catch(() => {
                notify("Ad cancelled or interrupted.", true);
            }).finally(() => {
                btn.disabled = false;
                btn.innerHTML = `<span>🎬</span> Watch Video to Unlock`;
            });
        }

        function notify(text, isErr) {
            const b = document.getElementById("statusBadge");
            b.innerText = text;
            b.className = `status-badge ${isErr ? 'status-err' : 'status-ok'}`;
            b.style.display = "block";
        }

        // Secret Admin Login
        let clicks = 0;
        let timer = null;
        function handleSecretTitleClick() {
            clicks++;
            clearTimeout(timer);
            timer = setTimeout(() => { clicks = 0; }, 1400);

            if (clicks >= 5) {
                clicks = 0;
                toggleModal('loginModal', true);
            }
        }

        function toggleModal(id, show) {
            document.getElementById(id).style.display = show ? 'flex' : 'none';
        }

        function verifyAdminLogin() {
            const u = document.getElementById("adminUser").value.trim();
            const p = document.getElementById("adminPass").value.trim();

            if (u === "chiku_.3919" && p === "Chintan@2009") {
                toggleModal('loginModal', false);
                toggleModal('adminPanel', true);
                document.getElementById("adminUser").value = "";
                document.getElementById("adminPass").value = "";
            } else {
                alert("Invalid Credentials!");
            }
        }

        // Direct Bot Link Generator
        function generateShortLink() {
            let val = document.getElementById("mainTargetUrl").value.trim();
            if (!val) {
                alert("Please enter target URL!");
                return;
            }

            if (!val.startsWith("http://") && !val.startsWith("https://")) {
                val = "https://" + val;
            }

            const encoded = encodeURIComponent(btoa(val));
            const directBotLink = `https://t.me/${BOT_USERNAME}/${BOT_APP_NAME}?startapp=${encoded}`;

            const out = document.getElementById("shortOut");
            out.value = directBotLink;
            document.getElementById("resultBox").style.display = "block";
            copyGeneratedLink();
        }

        function copyGeneratedLink() {
            const out = document.getElementById("shortOut");
            out.select();
            out.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(out.value);

            const msg = document.getElementById("copyMsg");
            msg.style.display = "block";
            setTimeout(() => { msg.style.display = "none"; }, 2000);
        }
    </script>
</body>
</html>
