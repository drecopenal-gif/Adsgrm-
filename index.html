<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>17F Shorter | Secure Unlocker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background: #090d16;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
        }
        .card {
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 36px 28px;
            border-radius: 28px;
            width: 100%;
            max-width: 390px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
        .brand-title {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            user-select: none;
            display: inline-block;
            margin-bottom: 24px;
        }
        .brand-title:active { transform: scale(0.96); }
        .icon-box {
            width: 70px;
            height: 70px;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 30px;
        }
        .field { text-align: left; margin-bottom: 18px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 8px; }
        .input-box {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .input-box:focus {
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        .btn-unlock {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.5);
            transition: transform 0.1s ease;
        }
        .btn-unlock:active { transform: scale(0.98); }
        .btn-unlock:disabled { background: #334155; box-shadow: none; cursor: not-allowed; color: #64748b; }
        .badge {
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }
        .badge-err { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
        .badge-ok { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 15, 0.9);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }
        .modal-box {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 24px;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #94a3b8;
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }
        .btn-modal {
            width: 100%;
            padding: 14px;
            background: #10b981;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
        .copy-group { display: flex; gap: 8px; margin-top: 10px; }
        .copy-group input {
            width: 100%;
            padding: 11px 14px;
            background: #090d16;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            color: #34d399;
            font-size: 13px;
            outline: none;
        }
        .copy-group button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 0 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Main Container -->
    <div class="card">
        <h1 class="brand-title" id="brandHeading" onclick="triggerSecretLogin()">17F Shorter</h1>
        
        <div class="icon-box">🔒</div>
        
        <div class="field">
            <label>Protected Resource URL</label>
            <input type="url" id="userLinkField" class="input-box" placeholder="Paste link here to unlock...">
        </div>

        <button id="unlockBtn" class="btn-unlock" onclick="handleUnlockProcess()">
            <span>🎬</span> Watch Video to Unlock
        </button>

        <div id="statusBadge" class="badge"></div>
    </div>

    <!-- Hidden Admin Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-box">
            <button class="close-btn" onclick="toggleModal('loginModal', false)">✕</button>
            <h3 style="margin-bottom: 18px; text-align: left; font-size: 18px;">🔐 Admin Access</h3>
            <div class="field">
                <label>Username</label>
                <input type="text" id="userInput" class="input-box" placeholder="Enter username" autocomplete="off">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="passInput" class="input-box" placeholder="Enter password">
            </div>
            <button class="btn-modal" onclick="verifyCredentials()">Sign In</button>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div id="adminModal" class="modal">
        <div class="modal-box">
            <button class="close-btn" onclick="toggleModal('adminModal', false)">✕</button>
            <h3 style="margin-bottom: 18px; text-align: left; font-size: 18px;">⚡ Protected Link Creator</h3>
            <div class="field">
                <label>Destination Target Link</label>
                <input type="url" id="targetInput" class="input-box" placeholder="https://t.me/your_channel_or_file">
            </div>
            <button class="btn-modal" onclick="createProtectedUrl()">Generate & Copy Link</button>

            <div id="resultSection" style="display: none; margin-top: 18px;">
                <label style="font-size: 12px; color: #94a3b8; display: block; text-align: left; margin-bottom: 6px;">Protected 17F Link</label>
                <div class="copy-group">
                    <input type="text" id="finalResultUrl" readonly>
                    <button onclick="copyToClipboard()">Copy</button>
                </div>
                <p id="copyText" style="color: #34d399; font-size: 12px; margin-top: 8px; text-align: left; display: none;">✓ Copied to clipboard!</p>
            </div>
        </div>
    </div>

    <script>
        const ADSGRAM_BLOCK_ID = "46253";

        // Query extraction
        const urlParams = new URLSearchParams(window.location.search);
        let extractedTarget = "";

        if (urlParams.get("url")) {
            try {
                extractedTarget = atob(decodeURIComponent(urlParams.get("url")));
                document.getElementById("userLinkField").value = window.location.href;
            } catch(e) {
                extractedTarget = "";
            }
        }

        // Init Adsgram
        const AdController = window.Adsgram ? window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID }) : null;

        function handleUnlockProcess() {
            let finalDestination = extractedTarget;
            const manualValue = document.getElementById("userLinkField").value.trim();

            if (!finalDestination && manualValue) {
                try {
                    const test = new URL(manualValue);
                    const qParam = test.searchParams.get("url");
                    finalDestination = qParam ? atob(decodeURIComponent(qParam)) : manualValue;
                } catch(e) {
                    finalDestination = manualValue;
                }
            }

            const btn = document.getElementById("unlockBtn");

            // Fallback if environment doesn't support Adsgram
            if (!AdController) {
                notify("Connecting sponsor...", false);
                setTimeout(() => {
                    executeRedirect(finalDestination || "https://telegram.org");
                }, 1000);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<span>⏳</span> Loading Sponsor Video...`;

            AdController.show().then(() => {
                notify("Ad Completed! Unlocking link...", false);
                setTimeout(() => {
                    if (finalDestination) {
                        executeRedirect(finalDestination);
                    } else {
                        notify("Verified! Enter link above.", false);
                        btn.disabled = false;
                        btn.innerHTML = `<span>🎬</span> Watch Video to Unlock`;
                    }
                }, 800);
            }).catch(() => {
                notify("Ad cancelled or interrupted. Retry.", true);
                btn.disabled = false;
                btn.innerHTML = `<span>🎬</span> Watch Video to Unlock`;
            });
        }

        function executeRedirect(url) {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
                window.Telegram.WebApp.openLink(url);
            } else {
                window.location.href = url;
            }
        }

        function notify(msg, isError) {
            const badge = document.getElementById("statusBadge");
            badge.innerText = msg;
            badge.className = `badge ${isError ? 'badge-err' : 'badge-ok'}`;
            badge.style.display = "block";
        }

        // 5-Click Secret Admin Logic
        let clickCounter = 0;
        let resetTimer = null;
        function triggerSecretLogin() {
            clickCounter++;
            clearTimeout(resetTimer);
            resetTimer = setTimeout(() => { clickCounter = 0; }, 1400);

            if (clickCounter >= 5) {
                clickCounter = 0;
                toggleModal('loginModal', true);
            }
        }

        function toggleModal(id, visible) {
            document.getElementById(id).style.display = visible ? 'flex' : 'none';
        }

        function verifyCredentials() {
            const u = document.getElementById("userInput").value.trim();
            const p = document.getElementById("passInput").value.trim();

            if (u === "chiku_.3919" && p === "Chintan@2009") {
                toggleModal('loginModal', false);
                toggleModal('adminModal', true);
                document.getElementById("userInput").value = "";
                document.getElementById("passInput").value = "";
            } else {
                alert("Unauthorized Access!");
            }
        }

        function createProtectedUrl() {
            const targetVal = document.getElementById("targetInput").value.trim();
            if (!targetVal) return alert("Please provide a valid URL.");

            const encoded = encodeURIComponent(btoa(targetVal));
            const fullShort = `${window.location.origin}${window.location.pathname}?url=${encoded}`;

            const resInput = document.getElementById("finalResultUrl");
            resInput.value = fullShort;
            document.getElementById("resultSection").style.display = "block";
            copyToClipboard();
        }

        function copyToClipboard() {
            const resInput = document.getElementById("finalResultUrl");
            resInput.select();
            resInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(resInput.value);

            const feedback = document.getElementById("copyText");
            feedback.style.display = "block";
            setTimeout(() => { feedback.style.display = "none"; }, 2000);
        }
    </script>
</body>
</html>
