    .aurora {

    @keyframes auroraMove {

      100% { transform: scale(1.08) translate(-10px, 10px); }

    .container {

      width: 100%; max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 26px;
      padding: 28px 22px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.1);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
    }

    .header-tab {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      background: rgba(4, 7, 15, 0.75);
      padding: 5px;
      border-radius: 18px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);

      font-size: 0.88rem;

      border: none;
      background: transparent;
      color: var(--muted);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;

    .tab-btn.active {

      color: #fff;
      border: 1px solid rgba(16, 185, 129, 0.45);
      box-shadow: 0 4px 18px rgba(16, 185, 129, 0.2);

    .badge-hot {

      top: -6px; right: 2px;
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      color: #fff;
      font-size: 0.62rem;
      font-weight: 800;

      border-radius: 99px;
      letter-spacing: 0.03em;
      box-shadow: 0 0 12px var(--gold-glow);

    @keyframes pulseBadge {

    .box { text-align: center; }

    @keyframes shimmer {

    .btn-unlock {

      font-weight: 600;
      box-shadow: 0 10px 35px rgba(0,0,0,0.8);
      opacity: 0; pointer-events: none; transition: 0.3s; z-index: 50;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .hidden { display: none !important; }
  </style>

    <script>

    function loadUserData() {
      const coins = parseInt(localStorage.getItem("user_coins") || "0");
      const doneToday = parseInt(localStorage.getItem(TODAY_KEY) || "0");
      const left = Math.max(0, 25 - doneToday);

      document.getElementById("coin-balance").textContent = coins;
      document.getElementById("daily-left").textContent = `${left}/25`;

      const btn = document.getElementById("btn-watch-ad");
      if (left === 0) {
        btn.disabled = true;
        btn.innerHTML = "<span>🚫 Daily Limit Reached (25/25)</span>";

    document.getElementById("btn-watch-ad").addEventListener("click", () => {
      const doneToday = parseInt(localStorage.getItem(TODAY_KEY) || "0");
      if (doneToday >= 25) {
        showToast("Daily limit of 25 ads reached! Come back tomorrow.");
        return;

      const btn = document.getElementById("btn-watch-ad");

      triggerAdSet(() => {
        let coins = parseInt(localStorage.getItem("user_coins") || "0") + 10;
        localStorage.setItem("user_coins", coins);
        localStorage.setItem(TODAY_KEY, doneToday + 1);

        showToast("🎉 +10 Coins Added to Your Wallet!");

        // Random Cooldown Interval: 5s, 6s, 7s, or 8s
        const randomWait = Math.floor(Math.random() * (8 - 5 + 1)) + 5;

    function startCountdown(seconds) {
      const btn = document.getElementById("btn-watch-ad");
      const status = document.getElementById("timer-status");
      status.classList.remove("hidden");

      let current = seconds;
      const interval = setInterval(() => {
        status.innerHTML = `<span>⏳ Ad Loading... Please wait (<strong>${current}s</strong>)</span>`;

          status.classList.add("hidden");

            btn.innerHTML = "<span>🔥 Watch Ads & Earn 10 Coins</span>";

      const upi = document.getElementById("upi-id").value.trim();

      if (coins < 500) {
        showToast(`Minimum 500 coins required (You currently have ${coins})!`);
        return;
      }

      if (!upi || !upi.includes("@")) {
        showToast("Please enter a valid UPI address!");
        return;
      }

      const btn = document.getElementById("btn-withdraw");
      btn.disabled = true;
      btn.innerHTML = "<span>⏳ Processing...</span>";

      const text =

        "━━━━━━━━━━━━━━━━━━━━\n" +
        `<b>Coins Redeemed:</b> 500 (₹5.00 INR)\n` +
        `<b>UPI ID:</b> <code>${upi}</code>\n` +
        `<b>Time:</b> ${new Date().toLocaleString('en-IN')}`;

      const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${encodeURIComponent(ADMIN_CHAT_ID)}&text=${encodeURIComponent(text)}&parse_mode=HTML`;[span_3](start_span)[span_3](end_span)

      fetch(url, { method: "GET", mode: "no-cors" })

          localStorage.setItem("user_coins", coins - 500);
          loadUserData();
          document.getElementById("upi-id").value = "";
          showToast("✅ Request sent! Payout will be processed within 24 hours.");
          btn.disabled = false;
          btn.innerHTML = "<span>💸 Withdraw ₹5.00</span>";
        })
        .catch(() => {
          showToast("Failed to transmit request. Please retry.");
          btn.disabled = false;
          btn.innerHTML = "<span>💸 Withdraw ₹5.00</span>";
        });
    });

    // --- UNLOCKER CONTROLLER ---
    document.getElementById("btn-unlock-start").addEventListener("click", () => {
      const btn = document.getElementById("btn-unlock-start");
      btn.disabled = true;
      triggerAdSet(() => {
        btn.classList.add("hidden");
        document.getElementById("unlock-done").classList.remove("hidden");
        const params = new URLSearchParams(window.location.search);
        const dest = params.get("dest") || "#";
        document.getElementById("btn-destination").href = dest;
        showToast("🔓 Link Unlocked Successfully!");
      });
    });

    loadUserData();
  </script>
