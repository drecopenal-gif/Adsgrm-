<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>17F Shorter | Link Unlocker & Rewards</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background: #090d16;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
        }
        .card {
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 34px 24px;
            border-radius: 28px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
        .brand-title {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            user-select: none;
            display: inline-block;
            margin-bottom: 22px;
        }
        .brand-title:active { transform: scale(0.96); }

        .field { text-align: left; margin-bottom: 14px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
        .input-box {
            width: 100%;
            padding: 13px 15px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .input-box:focus {
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        /* Get Reward Main Button */
        .btn-reward {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            border: none;
            border-radius: 15px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
            margin-top: 4px;
            transition: transform 0.1s ease;
        }
        .btn-reward:active { transform: scale(0.98); }
        .btn-reward:disabled { background: #334155; box-shadow: none; cursor: not-allowed; color: #64748b; }

        .divider {
            display: flex;
            align-items: center;
            margin: 22px 0 16px 0;
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .divider span { padding: 0 10px; }

        /* Bonus Watch Video Button */
        .btn-bonus {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            border: none;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 18px -4px rgba(99, 102, 241, 0.4);
            transition: transform 0.1s ease;
        }
        .btn-bonus:active { transform: scale(0.98); }
        .btn-bonus:disabled { background: #334155; box-shadow: none; cursor: not-allowed; color: #64748b; }

        .status-badge {
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }
        .status-err { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
        .status-ok { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }

        /* Modals */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 15, 0.9);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }
        .modal-box {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 24px;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #94a3b8;
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }
        .btn-modal {
            width: 100%;
            padding: 13px;
            background: #10b981;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }
        .copy-group { display: flex; gap: 8px; margin-top: 10px; }
        .copy-group input {
            width: 100%;
            padding: 11px 14px;
            background: #090d16;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            color: #34d399;
            font-size: 13px;
            outline: none;
        }
        .copy-group button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 0 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Main Container -->
    <div class="card">
        <h1 class="brand-title" id="secretTitle" onclick="handleSecretTitleClick()">17F Shorter</h1>

        <!-- User Input Area -->
        <div class="field">
            <label>Send / Paste Your Link</label>
            <input type="url" id="userLinkInput" class="input-box" placeholder="https://... (or open 17F link)">
        </div>

        <!-- Main Button: Watch Ad -> Auto Open Destination -->
        <button id="getRewardBtn" class="btn-reward" onclick="handleGetReward()">
            <span>🎁</span> Get Reward
        </button>

        <div class="divider"><span>OR BONUS EARNING</span></div>

        <!-- Extra Revenue Button -->
        <button id="bonusWatchBtn" class="btn-bonus" onclick="handleBonusAd()">
            <span>🎬</span> Watch Video to Unlock
        </button>

        <div id="statusBadge" class="status-badge"></div>
    </div>

    <!-- Hidden Admin Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-box">
            <button class="close-btn" onclick="toggleModal('loginModal', false)">✕</button>
            <h3 style="margin-bottom: 18px; text-align: left; font-size: 18px;">🔐 Secret Admin Login</h3>
            <div class="field">
                <label>Username</label>
                <input type="text" id="adminUser" class="input-box" placeholder="Enter username" autocomplete="off">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="adminPass" class="input-box" placeholder="Enter password">
            </div>
            <button class="btn-modal" onclick="verifyAdminLogin()">Sign In</button>
        </div>
    </div>

    <!-- Admin Link Creator Panel -->
    <div id="adminPanel" class="modal">
        <div class="modal-box">
            <button class="close-btn" onclick="toggleModal('adminPanel', false)">✕</button>
            <h3 style="margin-bottom: 18px; text-align: left; font-size: 18px;">⚡ Generate Locked Link</h3>
            <div class="field">
                <label>Main Target URL (તમારી અસલ લિંક)</label>
                <input type="url" id="mainTargetUrl" class="input-box" placeholder="https://t.me/your_file_or_channel">
            </div>
            <button class="btn-modal" onclick="generateShortLink()">Generate & Copy Link</button>

            <div id="resultBox" style="display: none; margin-top: 18px;">
                <label style="font-size: 12px; color: #94a3b8; display: block; text-align: left; margin-bottom: 6px;">Generated 17F Link</label>
                <div class="copy-group">
                    <input type="text" id="shortOut" readonly>
                    <button onclick="copyGeneratedLink()">Copy</button>
                </div>
                <p id="copyMsg" style="color: #34d399; font-size: 12px; margin-top: 8px; text-align: left; display: none;">✓ Copied to clipboard!</p>
            </div>
        </div>
    </div>

    <script>
        const BLOCK_ID = "46253";

        // Query param extraction (જો યુઝરે શોર્ટ લિંક ખોલી હોય)
        const params = new URLSearchParams(window.location.search);
        let embeddedDestination = "";

        if (params.get("url")) {
            try {
                embeddedDestination = atob(decodeURIComponent(params.get("url")));
                document.getElementById("userLinkInput").value = window.location.href;
            } catch(e) {
                embeddedDestination = "";
            }
        }

        // Adsgram Init
        let AdController = null;
        if (window.Adsgram) {
            AdController = window.Adsgram.init({ blockId: BLOCK_ID });
        }

        // 1. Get Reward: એડ ચાલશે અને પત્યા પછી સીધી લિંક ઓપન થશે
        function handleGetReward() {
            let finalTarget = embeddedDestination;
            const inputVal = document.getElementById("userLinkInput").value.trim();

            if (!finalTarget && inputVal) {
                try {
                    const parsed = new URL(inputVal);
                    const qParam = parsed.searchParams.get("url");
                    finalTarget = qParam ? atob(decodeURIComponent(qParam)) : inputVal;
                } catch(e) {
                    finalTarget = inputVal;
                }
            }

            if (!finalTarget) {
                notify("Please enter a link in the box first!", true);
                return;
            }

            const btn = document.getElementById("getRewardBtn");

            if (!AdController) {
                notify("Ad network connecting... Opening link!", false);
                setTimeout(() => { openTarget(finalTarget); }, 1200);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<span>⏳</span> Playing Ad...`;

            AdController.show().then(() => {
                notify("Verification Successful! Opening your link...", false);
                setTimeout(() => {
                    openTarget(finalTarget);
                    btn.disabled = false;
                    btn.innerHTML = `<span>🎁</span> Get Reward`;
                }, 800);
            }).catch(() => {
                notify("Please watch full ad to open link.", true);
                btn.disabled = false;
                btn.innerHTML = `<span>🎁</span> Get Reward`;
            });
        }

        // 2. Bonus Watch Video Button: માત્ર એડ ચલાવી રેવન્યુ વધારવા માટે
        function handleBonusAd() {
            const btn = document.getElementById("bonusWatchBtn");

            if (!AdController) {
                notify("Bonus ad loading...", false);
                setTimeout(() => { notify("Bonus verified! Thank you.", false); }, 1200);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<span>⏳</span> Loading Video...`;

            AdController.show().then(() => {
                notify("🎉 Thank you for watching! Bonus unlocked.", false);
                btn.disabled = false;
                btn.innerHTML = `<span>🎬</span> Watch Video to Unlock`;
            }).catch(() => {
                notify("Video was skipped or closed.", true);
                btn.disabled = false;
                btn.innerHTML = `<span>🎬</span> Watch Video to Unlock`;
            });
        }

        function openTarget(url) {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
                window.Telegram.WebApp.openLink(url);
            } else {
                window.location.href = url;
            }
        }

        function notify(text, isErr) {
            const b = document.getElementById("statusBadge");
            b.innerText = text;
            b.className = `status-badge ${isErr ? 'status-err' : 'status-ok'}`;
            b.style.display = "block";
        }

        // Secret 5-Click Admin Trigger
        let clicks = 0;
        let timer = null;
        function handleSecretTitleClick() {
            clicks++;
            clearTimeout(timer);
            timer = setTimeout(() => { clicks = 0; }, 1400);

            if (clicks >= 5) {
                clicks = 0;
                toggleModal('loginModal', true);
            }
        }

        function toggleModal(id, show) {
            document.getElementById(id).style.display = show ? 'flex' : 'none';
        }

        function verifyAdminLogin() {
            const u = document.getElementById("adminUser").value.trim();
            const p = document.getElementById("adminPass").value.trim();

            if (u === "chiku_.3919" && p === "Chintan@2009") {
                toggleModal('loginModal', false);
                toggleModal('adminPanel', true);
                document.getElementById("adminUser").value = "";
                document.getElementById("adminPass").value = "";
            } else {
                alert("Invalid Credentials!");
            }
        }

        function generateShortLink() {
            const val = document.getElementById("mainTargetUrl").value.trim();
            if (!val) {
                alert("Please enter target URL!");
                return;
            }

            const encoded = encodeURIComponent(btoa(val));
            const shortUrl = `${window.location.origin}${window.location.pathname}?url=${encoded}`;

            const out = document.getElementById("shortOut");
            out.value = shortUrl;
            document.getElementById("resultBox").style.display = "block";
            copyGeneratedLink();
        }

        function copyGeneratedLink() {
            const out = document.getElementById("shortOut");
            out.select();
            out.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(out.value);

            const msg = document.getElementById("copyMsg");
            msg.style.display = "block";
            setTimeout(() => { msg.style.display = "none"; }, 2000);
        }
    </script>
</body>
</html>
